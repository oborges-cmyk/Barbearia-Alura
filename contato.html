
<!DOCTYPE html> <!--sempre comeca com esse, a versao 5 html é informado ao navegador que essa é a usada-->
<html lang="pt-br"> <!--define o inico da estrutura, quase sempre a usa e a 'lang' é para ter a opção de
	 traduzir em português-->
	<head> <!--informações não visiveis do código-->
		<meta charset="UTF-8"> <!--codificação dos caracteres para a págona apresentar-se corretamente-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--para o layout no celular-->
		<title>Contato - Barbearia Alura</title> <!--título na aba-->
		<link rel="stylesheet" href="reset.css"> <!--indexaçao e sincronizaçao com css, relaçao com folha de estilo e 
		arquivo referenciado-->
	</head>
	<body> <!--informacoes visiveis no código-->
		<header> <!--cabecalho inicial-->
			<div class="caixa"> <!--'quadradaos' que dividem o código e uma classe para configurar no CSS-->
				<h1><img src="logo.png" alt="Logo da Barbearia Alura"></h1>

				<nav> <!--secao de navegacao-->
					<ul>
						<li><a href="index.html">Home</a></li>
						<li><a href="produtos.html">Produtos</a></li>
						<li><a href="contato.html">Contato</a></li>
					</ul>
				</nav>
			</div>
		</header>

		<main>
			<form>
				<label for="nomesobrenome">Nome e sobrenome</label>
				<input type="text" id="nomesobrenome" class="input-padrao" required>

				<label for="email">Email</label>
				<input type="email" id="email" class="input-padrao" required placeholder="seuemail@dominio.com">

				<label for="telefone">Telefone</label>
				<input type="tel" id="telefone" class="input-padrao" required placeholder="(XX) XXXXX-XXXX">

				<label for="mensagem">Mensagem</label>
				<textarea cols="70" rows="10" id="mensagem" class="input-padrao" required></textarea>

				<fieldset>
					<legend>Como prefere o nosso contato?</legend>
					<label for="radio-email"><input type="radio" name="contato" value="email" id="radio-email"> Email</label>
					
					<label for="radio-telefone"><input type="radio" name="contato" value="telefone" id="radio-telefone"> Telefone</label>
					
					<label for="radio-whatsapp"><input type="radio" name="contato" value="whatsapp" id="radio-whatsapp" checked> WhatsApp</label>
				</fieldset>

				<fieldset>
					<legend>Qual horário prefere ser atendido?</legend>
					<select>
						<option>Manhã</option>
						<option>Tarde</option>
						<option>Noite</option>
					</select>
				</fieldset>

				<label class="checkbox"><input type="checkbox" checked>Gostaria de receber nossas novidades por email?</label>

				<input type="submit" value="Enviar formulário" class="enviar">
			</form>

			<table>
				<tr>
					<td>Dia</td>
					<td>Horário</td>
				</tr>
				<tr>
					<td>Segunda</td>
					<td>8h ~ 20h</td>
				</tr>
				<tr>
					<td>Quarta</td>
					<td>8h ~ 20h</td>
				</tr>
				<tr>
					<td>Sexta</td>
					<td>8h ~ 20h</td>
				</tr>
			</table>
		</main>

		<footer>
			<img src="logo-branco.png" alt="Logo da Barbearia Alura">
			<p class="copyright">&copy; Copyright Barbearia Alura - 2019</p>
		</footer>
	</body>
</html>
